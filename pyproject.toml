[project]
name = "deckpilotai-backend"
version = "0.1.0"
description = "Python FastAPI multi-agent backend for deckpilotAI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "email-validator>=2.0",
  "sqlalchemy>=2.0",
  "libsql>=0.1.11",
  "alembic>=1.16",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "PyJWT>=2.10",
  "argon2-cffi>=25.1",
  "cryptography>=45.0",
  "boto3>=1.40",
  "pymupdf>=1.26",
  "python-pptx>=1.0",
  "python-docx>=1.2",
  "openpyxl>=3.1",
  "Pillow>=11.3",
  "opencv-python-headless>=4.12",
  "matplotlib>=3.10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
  "mypy>=1.17",
  "pip-audit>=2.9",
  "boto3-stubs[s3]>=1.40",
  "types-openpyxl>=3.1"
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["libsql", "libsql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "live: requires configured external services and RUN_LIVE_TESTS=1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true
