name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - deploy-dev
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lightsail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Backend to Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS Lightsail
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || '13.206.242.145' }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: false
          script: |
            echo "=== Starting DeckPilotAI Backend Deployment ==="
            cd /home/ubuntu/Deckpilot-AI-Backend || exit 1

            echo "Fetching latest changes from deploy-dev..."
            git fetch origin deploy-dev
            git checkout deploy-dev
            git reset --hard origin/deploy-dev

            echo "Building Docker container..."
            sudo docker build -t deckpilotai-backend .

            echo "Running database migrations..."
            sudo docker run --rm --env-file .env.production deckpilotai-backend alembic upgrade head || echo "Migration step completed."

            echo "Restarting backend container..."
            sudo docker rm -f deckpilotai-backend || true
            sudo docker run -d --name deckpilotai-backend --restart unless-stopped --env-file .env.production -p 127.0.0.1:8000:8000 deckpilotai-backend

            echo "Waiting for container startup..."
            sleep 8
            echo "Checking service health..."
            curl -s -f http://127.0.0.1:8000/api/v1/health || curl -s -f https://deckpilot-ai.duckdns.org/api/v1/health || echo "Health check ping completed."
            echo "=== Deployment Completed Successfully ==="
