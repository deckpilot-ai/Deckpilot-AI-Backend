name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - deploy-dev
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lightsail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Backend to Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS Lightsail
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || '13.206.242.145' }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: false
          script: |
            echo "=== Starting DeckPilotAI Backend Deployment ==="
            echo "Timestamp: $(date -u)"
            echo "Branch: deploy-dev"
            cd /home/ubuntu/Deckpilot-AI-Backend || exit 1

            echo "--- Pulling latest code ---"
            git fetch origin deploy-dev
            git checkout deploy-dev
            git reset --hard origin/deploy-dev
            echo "HEAD is now: $(git log --oneline -1)"

            echo "--- Building Docker image ---"
            sudo docker build -t deckpilotai-backend . 2>&1 | tail -20

            echo "--- Running database migrations ---"
            sudo docker run --rm --env-file .env.production deckpilotai-backend \
              alembic upgrade head || echo "Migration step completed (or no migrations pending)."

            echo "--- Stopping old container ---"
            sudo docker rm -f deckpilotai-backend || true

            echo "--- Starting new container ---"
            sudo docker run -d \
              --name deckpilotai-backend \
              --restart unless-stopped \
              --env-file .env.production \
              -p 127.0.0.1:8000:8000 \
              deckpilotai-backend

            echo "--- Waiting for startup (10s) ---"
            sleep 10

            echo "--- Health check ---"
            for i in 1 2 3; do
              if curl -sf http://127.0.0.1:8000/api/v1/health; then
                echo "Health check PASSED on attempt $i"
                break
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done

            echo "--- Pruning old Docker images ---"
            sudo docker image prune -f || true

            echo "=== Deployment Completed Successfully at $(date -u) ==="
